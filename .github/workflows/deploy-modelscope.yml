name: Deploy to ModelScope Studio

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'tests/**'
      - 'index.html'
      - 'favicon.svg'
      - 'assets/**'
      - 'content/**'
      - 'chapters/**'
      - 'CONTRIBUTING.md'
      - 'scripts/build-content.py'
      - 'scripts/chapter_markdown.py'
      - 'scripts/test_chapter_markdown.py'
      - 'scripts/build-content.mjs'
      - 'scripts/check-site.mjs'
      - 'scripts/build-exercises.py'
      - 'scripts/test_exercises.py'
      - 'scripts/check_exercise_references.py'
      - 'scripts/check_regex_parity.py'
      - 'scripts/test-exercise-worker.cjs'
      - 'scripts/test-exercise-sandbox-real.cjs'
      - 'scripts/test_pyodide_vendor.py'
      - 'README*.md'
      - 'LICENSE'
      - 'scripts/deploy-modelscope.mjs'
      - '.github/workflows/deploy-modelscope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelscope-ms-cookbook
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify reading community API
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest
          .venv/bin/python -m pytest tests -q
      - name: Verify chapter data and local resources
        run: |
          python3 scripts/test_chapter_markdown.py
          node scripts/build-content.mjs --check
          python3 scripts/build-i18n.py --check
          node scripts/check-site.mjs
      - name: Verify exercise data
        run: |
          python3 scripts/test_exercises.py
          python3 scripts/build-exercises.py --check
          python3 scripts/check_exercise_references.py
          # Needs `node` (step "Set up Node.js", same job) to compare each
          # stdout_matches pattern under JS RegExp as well as Python re.
          python3 scripts/check_regex_parity.py
      - name: Verify the exercise sandbox
        run: |
          # The grading logic, against the corpus harness. Its fake Pyodide is
          # fast and hermetic but cannot see the runtime itself, so this is
          # paired with the real-runtime test below.
          node scripts/test-exercise-worker.cjs
          node scripts/test-exercise-grader.cjs
          node scripts/test-exercise-store.cjs
          # The escape routes, against the real vendored Pyodide: `import js`
          # must raise ImportError, the network globals must stay sealed, and a
          # forged postMessage must be discarded. Two Critical defects shipped
          # with 17 green tests because the fake loads no files and has no js
          # module, so this step is the one that can see them.
          node scripts/test-exercise-sandbox-real.cjs
          python3 scripts/test_pyodide_vendor.py
      - name: Sync and deploy the website
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_STUDIO: ms-cookbook-team/ms-cookbook
        run: node scripts/deploy-modelscope.mjs
