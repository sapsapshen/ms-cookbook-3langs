<!doctype html>
<html lang="zh-CN" data-i18n-title="login.pageTitle" data-i18n-description="login.description">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7c13b">
  <meta name="description" content="登录超智学习空间，参与讨论、保存划线与同步练习进度。">
  <link rel="icon" href="/assets/brand/book-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=b3d5d3762ddb">
  <link rel="stylesheet" href="/assets/i18n.css?v=013ea7faaa84">
  <link rel="stylesheet" href="/assets/login.css?v=6684801f45f7">
  <title>登录｜超智学习空间</title>
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="login-top">
      <a class="login-wordmark" href="/" aria-label="超智学习空间首页" data-i18n-attr="aria-label:login.home">
        <img src="/assets/brand/book-mark.svg" alt="" width="34" height="34">
        <span>SILS</span>
      </a>
      <span class="language-switcher" data-language-switcher></span>
    </div>
    <section class="login-card" aria-labelledby="loginTitle">
      <p class="login-eyebrow">SUPER INTELLIGENCE LEARNING SPACE</p>
      <h1 id="loginTitle" data-i18n="login.title">登录学习空间</h1>
      <p class="login-intro" data-i18n="login.intro">登录后可以发表评论、保存划线与同步练习进度。</p>
      <form id="loginForm" novalidate>
        <label for="loginEmail" data-i18n="login.email">邮箱</label>
        <input id="loginEmail" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required placeholder="you@example.com">
        <label for="loginPassword" data-i18n="login.password">密码</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
        <button id="loginSubmit" class="login-submit" type="submit" data-i18n="login.submit">登录</button>
      </form>
      <p class="login-oauth" id="oauthLogin" hidden><a href="/auth/oauth/login" data-i18n="login.oauth">使用 ModelScope 社区账号登录</a></p>
      <p class="login-note" data-i18n="login.note">账号由站点管理员创建。忘记密码请联系管理员重置。</p>
    </section>
    <a class="login-back" href="/" data-i18n="login.back">← 返回阅读空间</a>
  </main>
  <script src="/assets/i18n.js?v=98fc3bc31065"></script>
  <script src="/assets/locale/zh.js?v=c6ee43b00633"></script>
  <script src="/assets/locale/en.js?v=e4f077ce2ee7"></script>
  <script src="/assets/locale/es.js?v=049d3abf1248"></script>
  <script src="/assets/language-switcher.js?v=d4550b90d72b"></script>
  <script>
  (() => {
    'use strict';
    const form = document.querySelector('#loginForm');
    const email = document.querySelector('#loginEmail');
    const password = document.querySelector('#loginPassword');
    const submit = document.querySelector('#loginSubmit');
    const status = document.querySelector('#loginStatus');
    const returnTo = new URLSearchParams(location.search).get('return_to') || '#home';
    const t = key => window.MSI18N.t(key);
    const failureKey = {
      401: 'login.badCredentials',
      403: 'login.badOrigin',
      429: 'login.rateLimited',
      503: 'login.unavailable'
    };
    function setStatus(text, state) {
      status.textContent = text;
      status.dataset.state = state || '';
      const invalid = state === 'error' ? 'true' : 'false';
      email.setAttribute('aria-invalid', invalid);
      password.setAttribute('aria-invalid', invalid);
    }
    fetch('/api/session', {credentials: 'same-origin'}).then(response => response.ok ? response.json() : null).then(data => {
      if (!data || !data.oauthLoginEnabled) return;
      const box = document.querySelector('#oauthLogin');
      box.hidden = false;
      box.querySelector('a').href = '/auth/oauth/login?return_to=' + encodeURIComponent(returnTo);
    }).catch(() => {});
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const emailValue = email.value.trim();
      const passwordValue = password.value;
      if (!emailValue || !passwordValue) {
        setStatus(t('login.missing'), 'error');
        (!emailValue ? email : password).focus();
        return;
      }
      submit.disabled = true;
      setStatus(t('login.pending'), '');
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: emailValue, password: passwordValue, return_to: returnTo})
        });
        if (!response.ok) {
          setStatus(t(failureKey[response.status] || 'login.failed'), 'error');
          submit.disabled = false;
          return;
        }
        let data = {};
        try { data = await response.json(); } catch { /* A 200 without JSON still returns home. */ }
        setStatus(t('login.success'), 'success');
        location.replace(data.return_to || '/');
      } catch {
        setStatus(t('login.network'), 'error');
        submit.disabled = false;
      }
    });
    email.focus();
  })();
  </script>
</body>
</html>
